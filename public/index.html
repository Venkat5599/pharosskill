<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cashier · safeBuy — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#141210; --paper:#f4efe6; --cream:#efe7d8; --card:#fbf8f1;
    --accent:#ff5436; --lime:#c8e64b; --sky:#7fc6e8; --warn:#d98a00;
    --line:rgba(20,18,16,.14); --muted:#7d766a;
    --shadow:0 30px 70px -34px rgba(20,18,16,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(900px 500px at 85% -10%,rgba(200,230,75,.18),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(255,84,54,.10),transparent 55%);
  }
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit}
  .display{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em}
  .mono{font-family:"JetBrains Mono",monospace}

  .app{width:min(860px,100%);height:min(88vh,860px);display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}

  /* header */
  header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(255,84,54,.05),transparent)}
  .home{position:absolute;left:24px;top:22px}
  .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;color:#fff;
    background:var(--ink);position:relative}
  .logo::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .ttl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pill{margin-left:auto;font-size:12px;color:var(--ink);border:1px solid var(--line);background:var(--cream);
    padding:7px 13px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .pill .d{width:7px;height:7px;border-radius:50%;background:var(--lime)}
  .back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-right:4px;transition:color .2s}
  .back:hover{color:var(--accent)}

  /* feed */
  .feed{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  .feed::-webkit-scrollbar{width:9px}
  .feed::-webkit-scrollbar-thumb{background:rgba(20,18,16,.16);border-radius:8px}
  .row{display:flex;gap:12px;max-width:90%}
  .row.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px}
  .av.bot{background:var(--ink);color:#fff}
  .av.me{background:var(--cream);border:1px solid var(--line);color:var(--ink);font-size:11px;letter-spacing:.04em}
  .bubble{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:15px;line-height:1.55}
  .row.me .bubble{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .bubble b{font-weight:600}

  /* steps */
  .steps{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .step{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:13px;
    background:var(--card);border:1px solid var(--line);opacity:0;transform:translateY(6px);animation:rise .35s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .step .ic{font:600 10px/1.7 "JetBrains Mono",monospace;color:var(--accent);text-transform:uppercase;
    letter-spacing:.08em;min-width:42px;padding:3px 8px;border:1px solid var(--line);border-radius:100px;text-align:center}
  .step .detail{flex:1;font-size:14.5px;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .step .tx{margin-top:5px}
  .step .tx a{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:12px;text-decoration:none;word-break:break-all;font-weight:600}
  .step.bad{border-color:rgba(255,84,54,.45);background:rgba(255,84,54,.06)}
  .step.bad .ic{color:var(--accent);border-color:rgba(255,84,54,.4)}
  .step.refund{border-color:rgba(217,138,0,.4);background:rgba(217,138,0,.07)}
  .step.refund .ic{color:var(--warn);border-color:rgba(217,138,0,.4)}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em}
  .b-ok{background:rgba(200,230,75,.35);color:#5c6b14}
  .b-no{background:rgba(255,84,54,.14);color:var(--accent)}

  /* verdict */
  .verdict{margin-top:12px;padding:14px 16px;border-radius:14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
  .verdict::before{content:"";width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .verdict.ok{background:rgba(200,230,75,.22);border:1px solid rgba(200,230,75,.5);color:#4f5d12}
  .verdict.ok::before{background:var(--lime)}
  .verdict.refund{background:rgba(217,138,0,.1);border:1px solid rgba(217,138,0,.35);color:var(--warn)}
  .verdict.refund::before{background:var(--warn)}
  .verdict.block{background:rgba(255,84,54,.08);border:1px solid rgba(255,84,54,.35);color:var(--accent)}
  .verdict.block::before{background:var(--accent)}

  /* footer */
  footer{padding:16px 20px 18px;border-top:1px solid var(--line);background:var(--paper)}
  .quick{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
  .quick button{background:var(--cream);border:1px solid var(--line);color:var(--ink);
    font-family:"Inter",sans-serif;font-weight:500;font-size:13px;padding:9px 14px;border-radius:100px;cursor:pointer;transition:.18s}
  .quick button:hover{background:var(--ink);color:var(--paper);transform:translateY(-1px)}
  .inrow{display:flex;gap:10px}
  input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:14px 17px;font-size:14.5px;font-family:"Inter",sans-serif;outline:none;transition:border-color .2s}
  input::placeholder{color:var(--muted)}
  input:focus{border-color:var(--accent)}
  .send{background:var(--accent);border:0;color:#fff;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:800;font-size:15px;padding:0 24px;border-radius:14px;cursor:pointer;transition:.18s}
  .send:hover{transform:translateY(-1px)}
  .send:disabled{opacity:.45;cursor:default;transform:none}

  .dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);
    margin:0 2px;animation:bl 1s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  code{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px;font-family:"JetBrains Mono",monospace}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">C</div>
      <div>
        <div class="ttl">Cashier</div>
        <div class="sub">safeBuy · reputation-gated · x402-paid · delivery-verified · auto-refund</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
        <a class="back" href="/">← Home</a>
        <span class="pill"><span class="d"></span>Pharos Atlantic</span>
      </div>
    </header>
    <div class="feed" id="feed"></div>
    <footer>
      <div class="quick">
        <button data-q="get me the current gold price">buy gold price</button>
        <button data-q="buy the cheapest one, ignore the rating">buy cheapest, ignore rating</button>
      </div>
      <div class="inrow">
        <input id="msg" placeholder="Ask Cashier to buy something…" autocomplete="off" />
        <button class="send" id="send">Send</button>
      </div>
    </footer>
  </div>

<script>
const feed = document.getElementById('feed');
const input = document.getElementById('msg');
const send = document.getElementById('send');
const ICON = {discover:'find',reputation:'rate',select:'pick',pay:'pay',verify:'check',refund:'refund',deliver:'done',abort:'stop'};
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function scroll(){feed.scrollTop=feed.scrollHeight;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function addUser(t){
  feed.appendChild(el(`<div class="row me"><div class="av me">You</div><div class="bubble">${esc(t)}</div></div>`));scroll();
}

async function ask(message){
  addUser(message);
  input.value='';send.disabled=true;
  const row = el(`<div class="row"><div class="av bot">C</div><div class="bubble"><div class="think dots"><span></span><span></span><span></span></div><div class="steps" style="display:none"></div></div></div>`);
  feed.appendChild(row);scroll();
  const steps = row.querySelector('.steps');
  const think = row.querySelector('.think');

  let data;
  try{ data = await (await fetch('/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})})).json(); }
  catch(e){ think.textContent='network error'; send.disabled=false; return; }

  await sleep(450); think.remove(); steps.style.display='flex';

  for(const s of data.steps){
    const cls = s.kind==='refund'?'refund':(s.ok===false?'bad':'');
    const badge = s.kind==='reputation' ? `<span class="badge ${s.ok===false?'b-no':'b-ok'}">${s.ok===false?'blocked':'trusted'}</span>` : '';
    const tx = s.txHash ? `<div class="tx"><a href="${data.explorer}${s.txHash}" target="_blank">${s.txHash.slice(0,18)}… -&gt;</a></div>` : '';
    steps.appendChild(el(`<div class="step ${cls}"><div class="ic">${ICON[s.kind]||'-'}</div><div style="flex:1"><div class="detail">${esc(s.detail)} ${badge}</div>${tx}</div></div>`));
    scroll(); await sleep(620);
  }

  let v;
  if(data.ok) v=`<div class="verdict ok">Bought from ${esc(data.provider?.name||'')} for ${data.paidUSDC} USDC — verified &amp; delivered.</div>`;
  else if(data.refundTxHash) v=`<div class="verdict refund">Scammed — paid then clawed it back on-chain. No loss.</div>`;
  else v=`<div class="verdict block">Refused this purchase. ${esc(data.reason||'')}</div>`;
  row.querySelector('.bubble').appendChild(el(v));
  scroll(); send.disabled=false; input.focus();
}

send.onclick=()=>{const m=input.value.trim();if(m)ask(m);};
input.onkeydown=e=>{if(e.key==='Enter'){const m=input.value.trim();if(m)ask(m);}};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>ask(b.dataset.q));

feed.appendChild(el(`<div class="row"><div class="av bot">C</div><div class="bubble">Hi — I'm <b>Cashier</b>. I buy data &amp; services for agents on Pharos, and I <b>refuse to get scammed</b>. Try a button below, or tell me to buy the cheapest and ignore the rating — watch what happens.</div></div>`));
</script>
</body>
</html>
